<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inscription')}"></head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center">

<div class="w-full max-w-sm">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold">MovieList</h1>
        <p class="text-gray-400 text-sm mt-1">Creer un compte</p>
    </div>

    <div class="bg-gray-900 rounded-xl p-6 border border-gray-800">
        <div th:if="${error}" class="mb-4 p-3 bg-red-900/50 border border-red-700 rounded-lg text-sm text-red-300"
             th:text="${error}"></div>

        <form action="/register" method="post" class="space-y-4" th:object="${form}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div>
                <label class="block text-sm text-gray-400 mb-1">Nom d'utilisateur</label>
                <input type="text" th:field="*{username}" required autofocus
                       class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Email</label>
                <input type="email" th:field="*{email}" required
                       class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Mot de passe</label>
                <input type="password" th:field="*{password}" required
                       class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium transition-colors">
                Creer le compte
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
            Deja un compte ?
            <a href="/login" class="text-blue-400 hover:text-blue-300">Se connecter</a>
        </p>
    </div>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
