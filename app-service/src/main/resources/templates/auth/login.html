<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center">

<div class="w-full max-w-sm">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold">MovieList</h1>
        <p class="text-gray-400 text-sm mt-1">Connectez-vous pour acceder a votre liste</p>
    </div>

    <div class="bg-gray-900 rounded-xl p-6 border border-gray-800">
        <div th:if="${param.error}" class="mb-4 p-3 bg-red-900/50 border border-red-700 rounded-lg text-sm text-red-300">
            Identifiants incorrects.
        </div>
        <div th:if="${param.registered}" class="mb-4 p-3 bg-green-900/50 border border-green-700 rounded-lg text-sm text-green-300">
            Compte cree. Connectez-vous.
        </div>
        <div th:if="${param.logout}" class="mb-4 p-3 bg-gray-800 border border-gray-700 rounded-lg text-sm text-gray-300">
            Deconnexion reussie.
        </div>

        <form action="/login" method="post" class="space-y-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="next" th:if="${nextUrl != null}" th:value="${nextUrl}"/>

            <div>
                <label class="block text-sm text-gray-400 mb-1">Nom d'utilisateur</label>
                <input type="text" name="username" required autofocus
                       class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Mot de passe</label>
                <input type="password" name="password" required
                       class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium transition-colors">
                Connexion
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
            Pas encore de compte ?
            <a href="/register" class="text-blue-400 hover:text-blue-300">Creer un compte</a>
        </p>
    </div>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
