<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('A voir')}"></head>
<body class="bg-gray-950 text-white min-h-screen">

<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-xl font-semibold flex items-center gap-2">
            <i data-lucide="bookmark" class="w-5 h-5 text-blue-400"></i>
            A voir
            <span class="text-sm font-normal text-gray-500 ml-1" th:text="'(' + ${entries.size()} + ')'"></span>
        </h1>
    </div>

    <div th:if="${entries.isEmpty()}" class="text-center text-gray-500 mt-20">
        <i data-lucide="bookmark" class="w-12 h-12 mx-auto mb-4 opacity-40"></i>
        <p>Votre liste est vide. <a href="/search" class="text-blue-400 hover:underline">Recherchez des films</a></p>
    </div>

    <div th:unless="${entries.isEmpty()}" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
        <div th:each="entry : ${entries}"
             class="bg-gray-900 rounded-xl overflow-hidden border border-gray-800 flex flex-col">

            <div class="aspect-[2/3] bg-gray-800">
                <img th:if="${entry.posterUrl != null}"
                     th:src="${entry.posterUrl}"
                     th:alt="${entry.title}"
                     class="w-full h-full object-cover"/>
                <div th:unless="${entry.posterUrl != null}"
                     class="w-full h-full flex items-center justify-center text-gray-600">
                    <i data-lucide="film" class="w-10 h-10"></i>
                </div>
            </div>

            <div class="p-3 flex flex-col flex-1 gap-2">
                <p class="text-sm font-medium leading-tight" th:text="${entry.title}"></p>

                <div class="flex gap-2 mt-auto">
                    <button onclick="openSeenModal(this)"
                            th:data-id="${entry.id}"
                            th:data-title="${entry.title}"
                            class="flex-1 flex items-center justify-center gap-1 bg-blue-600 hover:bg-blue-700 text-xs py-1.5 rounded-lg transition-colors">
                        <i data-lucide="check" class="w-3.5 h-3.5"></i>
                        Vu
                    </button>
                    <form action="#" th:action="@{/watchlist/{id}/delete(id=${entry.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="from" value="watchlist"/>
                        <button type="submit"
                                class="flex items-center justify-center p-1.5 bg-gray-800 hover:bg-red-900/50 hover:text-red-400 rounded-lg transition-colors">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Modal noter un film -->
<div id="seen-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-6 w-full max-w-sm">
        <h2 class="font-semibold mb-1">Marquer comme vu</h2>
        <p id="modal-title" class="text-sm text-gray-400 mb-4"></p>

        <form id="seen-form" action="/watchlist/1/seen" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Note (optionnel)</label>
                <div class="flex gap-2">
                    <label th:each="i : ${#numbers.sequence(1, 5)}" class="cursor-pointer">
                        <input type="radio" name="rating" th:value="${i}" class="sr-only peer"/>
                        <i data-lucide="star"
                           class="w-7 h-7 text-gray-600 peer-checked:text-yellow-400 peer-checked:fill-yellow-400 hover:text-yellow-300 transition-colors"></i>
                    </label>
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-1">Commentaire (optionnel)</label>
                <textarea name="comment" rows="2" placeholder="Votre avis..."
                          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <div class="flex gap-3">
                <button type="button" onclick="closeModal()"
                        class="flex-1 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm transition-colors">
                    Annuler
                </button>
                <button type="submit"
                        class="flex-1 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-sm font-medium transition-colors">
                    Valider
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    lucide.createIcons();

    function openSeenModal(btn) {
        const id = btn.dataset.id;
        document.getElementById('modal-title').textContent = btn.dataset.title;
        document.getElementById('seen-form').action = '/watchlist/' + id + '/seen';
        document.getElementById('seen-modal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('seen-modal').classList.add('hidden');
    }
</script>
</body>
</html>
