name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test all modules
        run: mvn verify

      - name: SonarCloud analysis
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_PROJECT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn sonar:sonar

      - name: Upload auth-service JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-auth-service
          path: auth-service/target/site/jacoco/

      - name: Upload app-service JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-app-service
          path: app-service/target/site/jacoco/

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: |
            auth-service/target/surefire-reports/
            app-service/target/surefire-reports/
